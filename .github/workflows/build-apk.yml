name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - 'web/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Download offline AI models
        shell: bash
        run: |
          mkdir -p android/app/src/main/assets/models
          curl -fL --retry 3 -o android/app/src/main/assets/models/pose_landmarker_full.task "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/1/pose_landmarker_full.task"
          curl -fL --retry 3 -o android/app/src/main/assets/models/face_landmarker.task "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task"
          curl -fL --retry 3 -o android/app/src/main/assets/models/hand_landmarker.task "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task"
          curl -fL --retry 3 -o android/app/src/main/assets/models/selfie_multiclass_256x256.tflite "https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_multiclass_256x256/float32/latest/selfie_multiclass_256x256.tflite"
          ls -lh android/app/src/main/assets/models
      - name: Verify JavaScript syntax
        run: |
          node --check web/ai-adapters.js
          for f in web/pf-*.js; do node --check "$f"; done
      - name: Run web smoke tests
        run: node tests/web-smoke.mjs
      - name: Verify v0.14 and v0.15 integration smoke checks
        run: |
          node tests/v014-smoke.mjs
          node tests/v015-smoke.mjs
      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PoseForge2D-v0.15-object-interaction-ai-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload source bundle
        uses: actions/upload-artifact@v4
        with:
          name: PoseForge2D-v0.15-source
          path: |
            README.md
            LICENSE
            app-spec.json
            docs
            models
            server-contract
            web
            android
            !android/app/build/**
            !android/app/src/main/assets/models/**
          if-no-files-found: error
          retention-days: 30
